name: restore-drill

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 0"

permissions:
  contents: read

jobs:
  restore-drill:
    name: Disposable PostgreSQL 18 restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Pull the disposable PostgreSQL image
        run: docker pull postgres:18
      - name: Run fake-data restore drill
        env:
          POSTGRES_IMAGE: postgres:18
        run: make restore-drill
