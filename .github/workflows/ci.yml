name: ci

on: [push, pull_request]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-alpine
        env: { POSTGRES_PASSWORD: pg, POSTGRES_DB: postgres }
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      TEST_DATABASE_URL: postgresql://postgres:pg@localhost:55432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Backend pytest collection (no database)
        run: pytest --collect-only -q
      - name: Migration consistency check
        working-directory: .
        run: scripts/check_migrations.sh
      - name: Import application
        env:
          APP_ENV: development
        run: python -c "import app.main"
      - name: Full backend suite (unit, database, and property tests)
        run: HYPOTHESIS_PROFILE=ci pytest -q

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Ruff check backend
        working-directory: backend
        run: ruff check .
      - name: Ruff check ops/backup
        working-directory: ops/backup
        run: ruff check .
      - name: Ruff format check backend
        working-directory: backend
        run: ruff format --check .
      - name: Ruff format check ops/backup
        working-directory: ops/backup
        run: ruff format --check .

  backend-typecheck:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: mypy app
      - name: Report mypy errors in tests
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, "-m", "mypy", "tests"],
              capture_output=True,
              check=False,
              text=True,
          )
          output = result.stdout + result.stderr
          print(output, end="")
          error_count = len(re.findall(r"^.*: error:", output, re.MULTILINE))
          print(f"MYPY-TEST-ERRORS: {error_count} (exit status {result.returncode})")
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: Frontend typecheck
        run: npm run typecheck
      - run: npm run build
      - name: Frontend node tests
        run: npm run test:roles
