name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pg, POSTGRES_DB: ajo }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      DATABASE_URL_DIRECT: postgresql://postgres:pg@localhost/ajo?sslmode=disable
      DATABASE_URL: postgresql://ajo_app:app_pw@localhost/ajo?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest tests/unit -q
      - name: Roles, migrations and integration tests
        run: |
          sed -e 's/CHANGE_ME_APP/app_pw/' -e 's/CHANGE_ME_READONLY/ro_pw/' scripts/neon_roles.sql > /tmp/roles.sql
          PGPASSWORD=pg psql -h localhost -U postgres -d ajo -v ON_ERROR_STOP=1 -f /tmp/roles.sql
          alembic upgrade head
          pytest -m integration -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
